name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you want to solve before proposing a
        solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or developer pain point does this address?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What change would you like to see?
      placeholder: Describe the behavior, API, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative solutions have you tried?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How should we know this is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
