version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    reviewers:
      - fabian-barney
    open-pull-requests-limit: 10
    ignore:
      # Dependabot tracks only the default Spring Boot line, the one the
      # starter's BOM import resolves to. Its patch PRs must set
      # spring.boot.<line>.version in the root pom.xml; the starter's
      # spring.boot.version stays a reference, and SpringBootDependencyResolutionIT
      # fails if the two differ. The other supported lines' pins are updated by
      # hand, and new lines are adopted through issues.
      - dependency-name: org.springframework.boot:spring-boot-dependencies
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      build-plugins:
        patterns:
          - org.apache.maven.plugins:*
          - org.jacoco:*
      test-tooling:
        patterns:
          - org.junit:*
          - org.junit.jupiter:*
          - media.barney:crap-java-maven-plugin
          - media.barney:cognitive-java-maven-plugin
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    reviewers:
      - fabian-barney
