name: Javadoc Pages

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: contract-java-pages
  cancel-in-progress: false

jobs:
  publish-javadoc:
    name: Publish retained Javadoc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ github.sha }}
          path: target/release-payload
      - name: Preserve site and extract retained Javadoc
        run: |
          export GNUPGHOME="$RUNNER_TEMP/pages-verify-key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
          python .github/scripts/release_pages.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: target/pages-upload
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Clean keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"
