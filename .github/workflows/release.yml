name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy artifacts after validation
        required: true
        default: false
        type: boolean
      revision:
        description: Maven project revision to release
        required: true
        default: "0.1.0"
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    env:
      MAVEN_RELEASE_REPOSITORY_URL: ${{ vars.MAVEN_RELEASE_REPOSITORY_URL }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Resolve release revision
        id: release-revision
        env:
          DISPATCH_REVISION: ${{ inputs.revision }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            revision="$DISPATCH_REVISION"
          else
            revision="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "$revision" ] || [[ "$revision" == *-SNAPSHOT ]]; then
            echo "::error::Release revision must be non-empty and non-SNAPSHOT: $revision"
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Build and verify release artifacts
        run: >
          ./mvnw -B -ntp -Prelease
          -Drevision=${{ steps.release-revision.outputs.revision }}
          -Dgpg.skip=true
          verify

      - name: Verify publish configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: |
          test -n "$MAVEN_RELEASE_REPOSITORY_URL"
          test -n "$MAVEN_USERNAME"
          test -n "$MAVEN_PASSWORD"

      - name: Publish release artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: >
          ./mvnw -B -ntp -Prelease -Dgpg.skip=true
          -Drevision=${{ steps.release-revision.outputs.revision }}
          -s .github/maven-settings.xml
          -DaltDeploymentRepository=release::default::${MAVEN_RELEASE_REPOSITORY_URL}
          deploy
