name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Detect release candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.candidate.outputs.publish }}
      version: ${{ steps.candidate.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Import pinned public key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/candidate-key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
      - name: Inspect exact push and first parent
        id: candidate
        run: python .github/scripts/release_control.py candidate "$GITHUB_SHA"
      - name: Clean keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"

  preflight:
    name: Nonpublishing release preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python -m unittest discover -s .github/scripts -p 'test_release_*.py' -v
      - run: python .github/scripts/release_preflight.py

  publish:
    name: Publish retained release payload
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: contract-java-publication
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Wait for exact source required gate
        run: python .github/scripts/release_control.py wait "$GITHUB_SHA"
      - name: Import public key and recheck candidate
        run: |
          export GNUPGHOME="$RUNNER_TEMP/release-key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          export RELEASE_CANDIDATE="$RUNNER_TEMP/release-candidate.json"
          echo "RELEASE_CANDIDATE=$RELEASE_CANDIDATE" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
          python .github/scripts/release_control.py candidate "$GITHUB_SHA"
      - name: Restore original payload on retries
        id: restore
        run: python .github/scripts/release_restore.py
      - name: Import and test encrypted private key before building or tagging
        if: steps.restore.outputs.needs-signing == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python .github/scripts/release_payload.py import-key
      - name: Build unsigned release payload once
        if: steps.restore.outputs.restored != 'true'
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          chmod +x mvnw
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          ./mvnw -B -ntp -Prelease "-Dscm.tag=v${RELEASE_VERSION}" \
            "-Dproject.build.outputTimestamp=${epoch}" -Dgpg.skip=true clean verify
          python .github/scripts/release_payload.py stage
      - name: Sign and validate retained bytes
        if: steps.restore.outputs.restored != 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python .github/scripts/release_payload.py seal
      - name: Retain immutable payload before publication
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-payload-${{ github.sha }}
          path: target/release-payload
          if-no-files-found: error
          retention-days: 90
      - name: Create, verify, and push signed annotated tag
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          chmod +x .github/scripts/gpg-release-sign.sh
          python .github/scripts/release_publish.py tag
      - name: Create draft and verify fourteen assets
        run: python .github/scripts/release_publish.py draft
      - name: Attest Maven payloads and checksum manifests
        # actions/attest v4 defaults to SLSA provenance without SBOM/predicate inputs.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            target/release-payload/central/**/*.pom
            target/release-payload/central/**/*.jar
            target/release-payload/central/**/*.json
            target/release-payload/central/**/*.xml
            target/release-payload/github/SHA256SUMS
            target/release-payload/github/SHA512SUMS
      - name: Bind parent SBOM to POM digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/release-payload/central/media/barney/contract-java/${{ needs.candidate.outputs.version }}/*.pom
          sbom-path: target/release-payload/github/contract-java-${{ needs.candidate.outputs.version }}.cdx.json
      - name: Bind core SBOM to JAR digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/release-payload/github/contract-core-${{ needs.candidate.outputs.version }}.jar
          sbom-path: target/release-payload/github/contract-core-${{ needs.candidate.outputs.version }}.cdx.json
      - name: Bind starter SBOM to JAR digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/release-payload/github/contract-spring-boot-starter-${{ needs.candidate.outputs.version }}.jar
          sbom-path: target/release-payload/github/contract-spring-boot-starter-${{ needs.candidate.outputs.version }}.cdx.json
      - name: Verify attestation identities and digests
        run: python .github/scripts/release_publish.py attestations
      - name: Publish prebuilt Central bundle and verify downloads
        env:
          MAVEN_CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
        run: python .github/scripts/release_publish.py central
      - name: Clean private keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"

  javadoc:
    needs: [candidate, publish]
    if: needs.candidate.outputs.publish == 'true'
    uses: ./.github/workflows/javadoc-pages.yml
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write

  finalize:
    name: Verify and finalize GitHub release
    needs: [candidate, publish, javadoc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ github.sha }}
          path: target/release-payload
      - name: Verify public release before finalization
        run: |
          export GNUPGHOME="$RUNNER_TEMP/verify-key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import .github/release-signing-key.asc
          python .github/scripts/release_publish.py finalize
      - name: Clean verification keyring
        if: always()
        run: |
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"
