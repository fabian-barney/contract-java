name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy artifacts after validation
        required: true
        default: false
        type: boolean
      revision:
        description: Maven project revision to release
        required: true
        default: "0.1.0"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release-revision.outputs.revision }}

    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Verify signing configuration
        run: |
          test -n "$GPG_PRIVATE_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"

      - name: Import GPG signing key
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Resolve release revision
        id: release-revision
        env:
          DISPATCH_REVISION: ${{ inputs.revision }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            revision="$DISPATCH_REVISION"
          else
            revision="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$revision" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Release revision must match the supported X.Y.Z tag format and cannot be a snapshot."
            exit 1
          fi

          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Verify changelog release date
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
        env:
          RELEASE_REVISION: ${{ steps.release-revision.outputs.revision }}
        run: |
          if grep -Fxq "## ${RELEASE_REVISION} - TBD" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must replace the target release TBD marker before tagging or publishing."
            exit 1
          fi

          escaped_revision="${RELEASE_REVISION//./\\.}"
          if ! grep -Eq "^## ${escaped_revision} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a dated section for the target release."
            exit 1
          fi

      - name: Verify release tag exists
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.release-revision.outputs.revision }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null

      - name: Build and verify release artifacts
        run: >
          ./mvnw -B -ntp -Prelease
          "-Drevision=${{ steps.release-revision.outputs.revision }}"
          verify

      - name: Stage SBOM release assets
        env:
          RELEASE_REVISION: ${{ steps.release-revision.outputs.revision }}
        run: |
          mkdir -p target/release-assets/sbom

          stage_bom() {
            module_path="$1"
            artifact_id="$2"

            cp "${module_path}/target/bom.json" "target/release-assets/sbom/${artifact_id}-${RELEASE_REVISION}-bom.json"
            cp "${module_path}/target/bom.json.asc" "target/release-assets/sbom/${artifact_id}-${RELEASE_REVISION}-bom.json.asc"
            cp "${module_path}/target/bom.xml" "target/release-assets/sbom/${artifact_id}-${RELEASE_REVISION}-bom.xml"
            cp "${module_path}/target/bom.xml.asc" "target/release-assets/sbom/${artifact_id}-${RELEASE_REVISION}-bom.xml.asc"
          }

          stage_bom . contract-java
          stage_bom contract-core contract-core
          stage_bom contract-spring-boot-starter contract-spring-boot-starter

      - name: Upload SBOM workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sboms-${{ steps.release-revision.outputs.revision }}
          path: target/release-assets/sbom
          if-no-files-found: error

      - name: Verify publish configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: |
          test -n "$CENTRAL_TOKEN_USERNAME"
          test -n "$CENTRAL_TOKEN_PASSWORD"

      - name: Publish release artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: >
          ./mvnw -B -ntp -Prelease
          "-Drevision=${{ steps.release-revision.outputs.revision }}"
          -s .github/maven-settings.xml
          deploy

  publish-sbom-release-assets:
    name: Publish SBOM Release Assets
    needs:
      - release
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download SBOM workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sboms-${{ needs.release.outputs.revision }}
          path: target/release-assets/sbom

      - name: Upload SBOM GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.release.outputs.revision }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi

          gh release upload "$RELEASE_TAG" target/release-assets/sbom/* --clobber
