name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B -ntp -P!quality-gates-all -DskipTests install

      - name: Upload Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: maven-repository
          path: /home/runner/.m2/repository
          if-no-files-found: error

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-targets
          path: |
            contract-core/target
            contract-spring-boot-starter/target
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Run unit tests
        run: ./mvnw -B -ntp -P!quality-gates-all verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            contract-core/target/site/jacoco
            contract-spring-boot-starter/target/site/jacoco
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Run package build
        run: ./mvnw -B -ntp -P!quality-gates-all -DskipTests package

  quality-crap-contract-core:
    name: verify / quality-crap-contract-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for contract-core
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-crap -pl contract-core -DskipTests -Djacoco.skip=true verify

  quality-crap-contract-spring-boot-starter:
    name: verify / quality-crap-contract-spring-boot-starter
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for contract-spring-boot-starter
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-crap -pl contract-spring-boot-starter -DskipTests -Djacoco.skip=true verify

  quality-cognitive-contract-core:
    name: verify / quality-cognitive-contract-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for contract-core
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-cognitive -pl contract-core -DskipTests -Djacoco.skip=true verify

  quality-cognitive-contract-spring-boot-starter:
    name: verify / quality-cognitive-contract-spring-boot-starter
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: maven-repository
          path: ${{ runner.home }}/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for contract-spring-boot-starter
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-cognitive -pl contract-spring-boot-starter -DskipTests -Djacoco.skip=true verify
