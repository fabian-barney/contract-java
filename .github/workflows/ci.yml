name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Run Spotless check
        run: ./mvnw -B -ntp spotless:check

      - name: Build
        run: ./mvnw -B -ntp -P!quality-gates-all -DskipTests install

      - name: Upload Maven repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maven-repository
          path: /home/runner/.m2/repository
          if-no-files-found: error

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-targets
          path: |
            contract-core/target
            contract-spring-boot-starter/target
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Run unit tests
        run: ./mvnw -B -ntp -P!quality-gates-all verify

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jacoco-reports
          path: |
            contract-core/target/site/jacoco
            contract-spring-boot-starter/target/site/jacoco
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: contract-core/target/site/jacoco/jacoco.xml,contract-spring-boot-starter/target/site/jacoco/jacoco.xml
          flags: java
          name: contract-java
          disable_search: true
          fail_ci_if_error: true

      - name: Note skipped Codecov upload
        if: ${{ env.HAS_CODECOV_TOKEN != 'true' }}
        run: echo "CODECOV_TOKEN is not configured; JaCoCo XML remains available as the jacoco-reports artifact."

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Run package build
        run: ./mvnw -B -ntp -P!quality-gates-all -DskipTests package

  verify-matrix:
    name: verify / ${{ matrix.os }} / JDK ${{ matrix.java-version }} / Boot ${{ matrix.boot-line }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        java-version:
          - "17"
          - "21"
          - "25"
        boot-line:
          - "4.0"
          - "4.1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Set Maven wrapper permissions
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Run matrix verification
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -P!quality-gates-all -Dspring.boot.smoke.line=${{ matrix.boot-line }} spotless:check verify

      - name: Run matrix verification
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -P!quality-gates-all "-Dspring.boot.smoke.line=${{ matrix.boot-line }}" spotless:check verify

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Run Error Prone and NullAway
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-static-analysis -DskipTests -Djacoco.skip=true clean compile

  quality-crap-contract-core:
    name: verify / quality-crap-contract-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for contract-core
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-crap -pl contract-core -am -DskipTests -Djacoco.skip=true verify

  quality-crap-contract-spring-boot-starter:
    name: verify / quality-crap-contract-spring-boot-starter
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jacoco-reports
          path: .

      - name: Run crap-java gate for contract-spring-boot-starter
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-crap -pl contract-spring-boot-starter -am -DskipTests -Djacoco.skip=true verify

  quality-cognitive-contract-core:
    name: verify / quality-cognitive-contract-core
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for contract-core
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-cognitive -pl contract-core -am -DskipTests -Djacoco.skip=true verify

  quality-cognitive-contract-spring-boot-starter:
    name: verify / quality-cognitive-contract-spring-boot-starter
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Maven wrapper permissions
        run: chmod +x mvnw

      - name: Download Maven repository
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: maven-repository
          path: /home/runner/.m2/repository

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build-targets
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jacoco-reports
          path: .

      - name: Run cognitive-java gate for contract-spring-boot-starter
        run: ./mvnw -B -ntp -P!quality-gates-all,quality-gate-cognitive -pl contract-spring-boot-starter -am -DskipTests -Djacoco.skip=true verify

  build-and-test-compat:
    name: Build and Test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit
      - package
      - verify-matrix

    steps:
      - name: Fail when the build or test pipeline failed
        if: ${{ needs.build.result != 'success' || needs.test-unit.result != 'success' || needs.package.result != 'success' || needs.verify-matrix.result != 'success' }}
        run: exit 1

      - name: Confirm legacy build-and-test gate
        run: echo "Build and test stages succeeded."

  quality-crap-compat:
    name: crap-java Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - quality-crap-contract-core
      - quality-crap-contract-spring-boot-starter

    steps:
      - name: Fail when a CRAP gate failed
        if: ${{ needs.quality-crap-contract-core.result != 'success' || needs.quality-crap-contract-spring-boot-starter.result != 'success' }}
        run: exit 1

      - name: Confirm legacy CRAP gate
        run: echo "All CRAP gates succeeded."

  quality-cognitive-compat:
    name: cognitive-java Gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - quality-cognitive-contract-core
      - quality-cognitive-contract-spring-boot-starter

    steps:
      - name: Fail when a cognitive gate failed
        if: ${{ needs.quality-cognitive-contract-core.result != 'success' || needs.quality-cognitive-contract-spring-boot-starter.result != 'success' }}
        run: exit 1

      - name: Confirm legacy cognitive gate
        run: echo "All cognitive gates succeeded."
